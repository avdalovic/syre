[project]
name = "syre"
version = "1.0.0"
description = "Follow the Power: symbolic and readable intrusion detection for reconfigurable power networks"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
# Exact versions the paper results were produced with.
dependencies = ["numpy==2.4.5", "pandas==3.0.3", "sympy==1.14.0", "matplotlib==3.10.9"]

[project.optional-dependencies]
fit = ["pysr==1.5.10"]

[project.scripts]
syre = "syre.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["syre"]
